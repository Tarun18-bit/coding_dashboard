name: Automated Data Sync

on:
  schedule:
    # Once an hour, at :17. GitHub delays or drops scheduled runs at the top of the hour
    # (its busiest moment), so an off-peak minute runs far more reliably.
    - cron: '17 * * * *'
  workflow_dispatch: # Allows manual on-demand trigger from GitHub Actions UI

jobs:
  sync-dashboard:
    name: Sync Coding Stats
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dashboard Sync Endpoint
        run: |
          RAW_URL="${{ secrets.APP_URL }}"
          SYNC_TOKEN="${{ secrets.SYNC_SECRET_TOKEN }}"

          APP_URL="${RAW_URL:-https://coding-dashboard-two.vercel.app}"

          # Never fall back to a hardcoded token: fail loudly if the secret is missing
          if [ -z "${SYNC_TOKEN}" ]; then
            echo " [ERROR] SYNC_SECRET_TOKEN repository secret is not set"
            exit 1
          fi

          # Strip any trailing slash from APP_URL
          APP_URL="${APP_URL%/}"
          ENDPOINT="${APP_URL}/api/sync"

          echo "=========================================="
          echo "Initiating Data Sync"
          echo "Target Endpoint: ${ENDPOINT}"
          echo "=========================================="

          # Request sync endpoint, save body to file and capture status code
          HTTP_STATUS=$(curl -s -L -o /tmp/sync_response.json -w "%{http_code}" -X POST "${ENDPOINT}" \
            -H "Authorization: Bearer ${SYNC_TOKEN}" \
            -H "Content-Type: application/json" \
            --max-time 60)

          echo "HTTP Status Code: ${HTTP_STATUS}"
          echo "Response Body:"
          if [ -f /tmp/sync_response.json ]; then
            cat /tmp/sync_response.json
            echo ""
          fi

          if [ "${HTTP_STATUS}" -ge 200 ] && [ "${HTTP_STATUS}" -lt 300 ]; then
            echo " Data sync completed successfully!"
            exit 0
          else
            echo " [ERROR] Data sync failed with HTTP status ${HTTP_STATUS}"
            exit 1
          fi
